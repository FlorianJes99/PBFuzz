[package]
name = "fuzzer_pseudo_bool"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.5.50", features = ["derive"] }
csv = "1.4.0"
env_logger = "0.11.8"
itertools = "0.14.0"

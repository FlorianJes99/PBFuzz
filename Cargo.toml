[package]
name = "fuzzer_pseudo_bool"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
clap = { version = "4.5.50", features = ["derive"] }
csv = "1.4.0"
fern = "0.7.1"
itertools = "0.14.0"
log = "0.4.28"
rand = "0.10.1"
rayon = "1.11.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
veripb = "3.0.2"

[profile.release]
debug = true

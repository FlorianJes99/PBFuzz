# Inteded use:
#
# fuzzer_orchestrator \
#   -t <amount minutes> \
#   --thread-count <amount threads> \
#   --log warn \
#   --timeout-external-program-secs 10 \
#   --settings-file /app/configuration/pbs_settings_10_sec.toml \
#   --solver-configs /app/solver_configs/exact.toml /app/solver_configs/hitpbo.toml  /app/solver_configs/roundingsat.toml /app/solver_configs/sat4j.toml /app/solver_configs/naps.toml /app/solver_configs/scip.toml
 
 
# GeneratorSettings - configuration for random grammar generation

# Type of grammar to generate: "PBS" (pseudo boolean solving) or "PBO" (pseudo boolean optimization)
# Default is "PBO"
grammar_kind = "PBS"

# Options are: "FromSolution" and "Random" or nothing at all
# If no generation_method is provided, the chosen config is sampled 50:50
generation_method = "Random"

[random]
 # Maximum number of distinct variables used in the grammar
max_vars = 90

# How many literals are sampled for the optimization (minimization) term
amount_lits_min_term = 15

# --- Cancel Condition ---
#   "CountUnsat"       - stop after a total number of unsatisfying assignments
#   "CountConstraints" - stop after a fixed number of constraints
[random.cancel_condition]
CountConstraints = { max_constraints = 109 }

[random.builders_config.three_literal]
weight = 6
coeff_lower = -5
coeff_upper = 5
degree_lower = 0.38
degree_upper = 0.52

[random.builders_config.cardinality]
weight = 10
amount_lits = 30
degree_lower = 0.38
degree_upper = 0.52

[random.builders_config.generic]
weight = 1
amount_lits = 20
coeff_lower = -5
coeff_upper = 5
degree_lower = 0.38
degree_upper = 0.52

[random.builders_config.exactly_one]
weight = 1
amount_lits = 5

[random.builders_config.doubling_pairs]
weight = 1
amount_pairs = 4

# ---------------------------------------------------------------------------
# from_solution only supports generic_length and doubling_pairs at the moment
# ---------------------------------------------------------------------------

[from_solution]
max_vars = 240

# How many literals are sampled for the optimization (minimization) term
amount_lits_min_term = 40

[from_solution.cancel_condition]
CountConstraints = { max_constraints = 1000 }

[from_solution.builders_config.generic]
weight = 1
amount_lits = 20
coeff_lower = -10
coeff_upper = 10
# does not matter for from solution generation
degree_lower = 0.0
degree_upper = 1.0

[from_solution.builders_config.doubling_pairs]
weight = 2
amount_pairs = 20

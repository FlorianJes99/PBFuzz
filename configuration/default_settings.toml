# GeneratorSettings — configuration for all fuzzer properties

# Type of grammar to generate: "PBS" (pseudo boolean solving) or "PBO" (pseudo boolean optimization)
# Default is "PBO"
grammar_kind = "PBO"

# Options are: "FromSolution" and "Random" or nothing at all
# If no generation_method is provided, the chosen config is sampled 50:50
# generation_method = "FromSolution"

[random]
 # Maximum number of distinct variables used in the grammar
max_vars = 80

# How many literals are sampled for the optimization (minimization) term
amount_lits_min_term = 15

# --- Cancel Condition ---
#   "CountUnsat"       — stop after a total number of unsatisfying assignments
#   "CountConstraints" — stop after a fixed number of constraints
[random.cancel_condition]
CountConstraints = { max_constraints = 100 }

[random.builders_config.three_literal]
weight = 6
coeff_lower = -5
coeff_upper = 5
degree_lower = 0.38
degree_upper = 0.52

[random.builders_config.cardinality]
weight = 10
amount_lits = 20
degree_lower = 0.38
degree_upper = 0.52

[random.builders_config.generic]
weight = 1
amount_lits = 15
coeff_lower = -5
coeff_upper = 5
degree_lower = 0.38
degree_upper = 0.52

[random.builders_config.exactly_one]
weight = 1
amount_lits = 4

[random.builders_config.doubling_pairs]
weight = 1
amount_pairs = 4

# ---------------------------------------------------------------------------
# from_solution only supports generic_length and doubling_pairs at the moment
# ---------------------------------------------------------------------------

[from_solution]
max_vars = 80

# How many literals are sampled for the optimization (minimization) term
amount_lits_min_term = 30

[from_solution.cancel_condition]
CountConstraints = { max_constraints = 100 }

[from_solution.builders_config.generic]
weight = 1
amount_lits = 15
coeff_lower = -10
coeff_upper = 10
# does not matter for from solution generation
degree_lower = 0.0
degree_upper = 1.0

[from_solution.builders_config.doubling_pairs]
weight = 2
amount_pairs = 10
